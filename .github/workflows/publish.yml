name: Publish

# Push a tag vX.Y.Z matching the version in pyproject.toml: the tests run, then the package goes to PyPI
# through trusted publishing (no token in the repository).
on:
  push:
    tags: ["v*"]

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Tag matches the package version
        run: |
          python - <<'PY'
          import os, re, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          init = re.search(r'__version__ = "([^"]+)"', open("src/texdocxdrafter/__init__.py").read()).group(1)
          tag = os.environ["GITHUB_REF_NAME"]
          assert tag == f"v{version}" and init == version, f"tag {tag}, pyproject {version}, __init__ {init}"
          PY

      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/texdocxdrafter/
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
