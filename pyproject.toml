[project]
name = "texdocxdrafter"
version = "0.1.1"
description = "TeX-DOCX Drafter: drafts a clean, style-mapped Word document from a compiled LaTeX paper, for coauthors who edit in Word"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lin Ma" }]
requires-python = ">=3.12"
keywords = ["latex", "docx", "word", "biblatex", "conversion", "academic-writing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing :: Markup :: LaTeX",
  "Topic :: Office/Business :: Office Suites",
]
dependencies = ["python-docx", "pylatexenc", "lxml", "pyyaml", "latex2mathml", "mathml2omml"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
texdocxdrafter = "texdocxdrafter.cli:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
texdocxdrafter = ["defaults/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
